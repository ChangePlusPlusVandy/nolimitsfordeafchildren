name: Deploy

# Deploys to Cloudflare Workers. Runs automatically on pushes to main and can
# be triggered manually from the Actions tab (workflow_dispatch).
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — API token with Workers Scripts:Edit, D1:Edit,
#                           Workers R2 Storage:Edit for the account.
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id.
#
# App runtime secrets (BETTER_AUTH_SECRET, EMAIL_FROM_ADDRESS, …) are worker
# secrets managed via `wrangler secret put`, not GitHub secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys — never cancel one mid-flight, queue the next instead.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build · Migrate D1 · Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build (OpenNext)
        run: pnpm build

      # Apply pending D1 migrations before shipping code that expects them.
      # `migrations apply` is a no-op when the database is already current.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply nolimits-d1-staging --remote

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy
