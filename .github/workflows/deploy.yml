name: Deploy

# Pushes to main deploy staging; published releases deploy production.
# Manual dispatch selects either environment.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN  — API token with Workers Scripts:Edit, D1:Edit,
#                           Workers R2 Storage:Edit for the account.
#   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id.
#
# App runtime secrets (BETTER_AUTH_SECRET, EMAIL_FROM_ADDRESS, …) are worker
# secrets managed via `wrangler secret put`, not GitHub secrets.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        required: true
        default: staging
        options: [staging, production]

# Serialize deploys — never cancel one mid-flight, queue the next instead.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build · Migrate D1 · Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'staging' }}
    defaults:
      run:
        working-directory: app
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: ${{ github.event_name == 'release' && 'production' || inputs.environment || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: after provisioning, copy tofu output -json d1_id.value into
      # wrangler.jsonc env.production before building the flattened config.
      - name: Require provisioned production D1
        if: env.CLOUDFLARE_ENV == 'production'
        run: |
          if grep -q 'TODO_TOFU_OUTPUT_production' wrangler.jsonc; then
            echo 'Set the production D1 ID from infra/ tofu output -json before deploying.' >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Vite build cache
        uses: actions/cache@v4
        with:
          path: app/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build (Vinext)
        # CLOUDFLARE_ENV selects bindings at build time, not deploy time.
        run: pnpm --filter nolimits-app build

      # Apply pending D1 migrations before shipping code that expects them.
      # `migrations apply` is a no-op when the database is already current.
      - name: Apply D1 migrations
        run: pnpm --filter nolimits-app exec wrangler d1 migrations apply DB --env "$CLOUDFLARE_ENV" --remote

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter nolimits-app exec vinext-cloudflare deploy --config dist/server/wrangler.json
