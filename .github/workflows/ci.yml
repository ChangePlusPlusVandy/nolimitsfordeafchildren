name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch/PR — new pushes cancel the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck · Lint · Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  build:
    name: Build (Vinext)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Vite build cache
        uses: actions/cache@v4
        with:
          path: app/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Apply local D1 migrations (unit-test prerequisite)
        run: pnpm --filter nolimits-app exec wrangler d1 migrations apply nolimits-d1-staging --local

      - name: Unit tests
        run: pnpm --filter nolimits-app test:unit

      - name: Build
        run: pnpm --filter nolimits-app build

      - name: Validate Worker bundle and cron wiring
        shell: bash
        run: |
          crons=$(grep -oP '_CRON = "\K[^"]+' src/server/cron/index.ts)
          config=$(node -e '
            const raw = require("node:fs").readFileSync("wrangler.jsonc", "utf8");
            console.log(raw.split("\n").filter((line) => !line.trimStart().startsWith("//"))
              .join("\n").replace(/,(\s*[}\]])/g, (_, close) => close));
          ')
          generated=dist/server/wrangler.json
          while IFS= read -r cron; do
            jq -e --arg cron "$cron" '(.triggers.crons // []) | index($cron) != null' <<< "$config"
            jq -e --arg cron "$cron" '(.triggers.crons // []) | index($cron) != null' "$generated"
          done <<< "$crons"
          for binding in DB BUCKET EMAIL; do
            jq -e --arg binding "$binding" '
              [.d1_databases // [], .r2_buckets // [], .send_email // []]
              | any(.[]; tojson | contains("\"" + $binding + "\""))
            ' "$generated"
          done
          bundle=dist/server/index.js
          grep -Fq '[Cron] scheduled event' "$bundle"
          node -e '
            const bundle = require("node:fs").readFileSync(process.argv[1], "utf8");
            const assert = require("node:assert/strict");
            const defaultAlias = bundle.match(/export\{[^}]*\b(\w+) as default\b[^}]*\}/)?.[1];
            assert(defaultAlias, "Worker bundle has no default export");
            const composed = new RegExp("(var|const|let)\\s+" + defaultAlias + "\\s*=\\s*\\{[^}]*\\bscheduled\\b");
            assert(composed.test(bundle), "Worker default export does not compose scheduled");
          ' "$bundle"

      - name: Validate generated config and bundle (wrangler dry-run, no upload)
        run: pnpm --filter nolimits-app exec wrangler deploy --dry-run --config dist/server/wrangler.json

  e2e:
    name: e2e (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter nolimits-e2e exec playwright install --with-deps chromium

      # Authenticated suites (navigation) need the deterministic fake seed.
      # Local-only D1/R2 state; never touches remote resources.
      - name: Apply local D1 migrations
        run: pnpm --filter nolimits-app exec wrangler d1 migrations apply nolimits-d1-staging --local

      - name: Seed local fake data
        run: pnpm --filter nolimits-app db:seed

      - name: Run Playwright
        run: pnpm test:e2e
